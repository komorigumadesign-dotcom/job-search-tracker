<title>案件ウォッチボード</title>
<!-- 更新手順は job-search-report-spec.md の「スマホ確認用ページの更新」を参照。公開先URLは job-search-check-log.md 冒頭に記載。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;
    --surface:#ffffff;
    --surface-2:#f2eee6;
    --border:#e6ddcf;
    --text:#241f2e;
    --text-dim:#6b6376;
    --accent:#7a5fb8;
    --accent-soft:#efe9fb;
    --accent-ink:#4a3a7a;
    --ok:#2f7d5e;
    --ok-soft:#e2f3ea;
    --check:#b3792a;
    --check-soft:#faedd8;
    --site-cw:#3d7ab3;
    --site-cw-soft:#e4eef8;
    --site-lc:#c25a3f;
    --site-lc-soft:#fbe9e2;
    --site-co:#3d9188;
    --site-co-soft:#e2f4f1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18151f;
      --surface:#221e2c;
      --surface-2:#2a2536;
      --border:#3a3346;
      --text:#eee9f6;
      --text-dim:#a79fbb;
      --accent:#a68bea;
      --accent-soft:#332a4d;
      --accent-ink:#d8c9fb;
      --ok:#7bd4ac;
      --ok-soft:#1f3a30;
      --check:#e3b567;
      --check-soft:#3c3120;
      --site-cw:#7fb4e6;
      --site-cw-soft:#22344a;
      --site-lc:#e8917a;
      --site-lc-soft:#402a26;
      --site-co:#7fd0c4;
      --site-co-soft:#1f3a37;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18151f;
    --surface:#221e2c;
    --surface-2:#2a2536;
    --border:#3a3346;
    --text:#eee9f6;
    --text-dim:#a79fbb;
    --accent:#a68bea;
    --accent-soft:#332a4d;
    --accent-ink:#d8c9fb;
    --ok:#7bd4ac;
    --ok-soft:#1f3a30;
    --check:#e3b567;
    --check-soft:#3c3120;
    --site-cw:#7fb4e6;
    --site-cw-soft:#22344a;
    --site-lc:#e8917a;
    --site-lc-soft:#402a26;
    --site-co:#7fd0c4;
    --site-co-soft:#1f3a37;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width:640px;
    margin:0 auto;
  }
  h1,h2{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;}

  header.top{
    padding-top:6px;
    margin-bottom:18px;
  }
  header.top .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  header.top h1{
    font-size:24px;
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  header.top p{
    margin:0;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
  }

  .summary{
    display:flex;
    gap:8px;
    margin:16px 0 18px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .stat{
    flex:1 0 auto;
    min-width:84px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .stat .n{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:20px;
    font-weight:900;
    font-variant-numeric: tabular-nums;
  }
  .stat .l{
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:16px;
    -webkit-overflow-scrolling:touch;
  }
  .tabs button{
    flex:0 0 auto;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
  }
  .tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 15px;
    text-decoration:none;
    color:var(--text);
    display:block;
    transition:border-color .15s ease;
  }
  .card:active{ border-color:var(--accent); }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.cw{ background:var(--site-cw-soft); color:var(--site-cw); }
  .badge.lc{ background:var(--site-lc-soft); color:var(--site-lc); }
  .badge.co{ background:var(--site-co-soft); color:var(--site-co); }

  .flag{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
  }
  .flag.ok{ background:var(--ok-soft); color:var(--ok); }
  .flag.check{ background:var(--check-soft); color:var(--check); }

  .card h2{
    font-size:15.5px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 8px;
    text-wrap:balance;
    color:var(--text);
  }

  .card .price{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:16px;
    font-weight:900;
    color:var(--accent-ink);
    font-variant-numeric: tabular-nums;
    margin-bottom:6px;
  }
  .card .price small{
    font-size:11px;
    font-weight:500;
    color:var(--text-dim);
    margin-left:4px;
  }

  .card .memo{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
    margin-bottom:10px;
  }

  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border-top:1px solid var(--border);
    padding-top:9px;
  }
  .card-bottom .contract{
    font-size:11px;
    color:var(--text-dim);
  }
  .card-bottom .open{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:3px;
    flex-shrink:0;
  }

  footer{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:11px;
    color:var(--text-dim);
    line-height:1.7;
  }

  [hidden]{display:none!important;}
</style>

<header class="top">
  <div class="eyebrow">JOB SEARCH WATCHBOARD · 2026-09-27</div>
  <h1>案件ウォッチボード</h1>
  <p>クラウドワークス・ランサーズ・ココナラの公開案件から、副業向けWebデザイン案件を一次スクリーニング。タップでそのまま案件ページへ移動できます。</p>
</header>

<div class="summary">
  <div class="stat"><div class="n">15</div><div class="l">新規案件</div></div>
  <div class="stat"><div class="n">11</div><div class="l">要確認○</div></div>
  <div class="stat"><div class="n">4</div><div class="l">見積り△</div></div>
  <div class="stat"><div class="n">3</div><div class="l">サイト</div></div>
</div>

<div class="tabs" id="tabs">
  <button class="active" data-filter="all">すべて</button>
  <button data-filter="LP">LP制作</button>
  <button data-filter="HP">HP・ポータル</button>
  <button data-filter="バナー">バナー・SNS</button>
  <button data-filter="ロゴ">ロゴ</button>
</div>

<div class="list" id="list"></div>

<footer>
  データ元：job-search-check-log.md（2026-09-27 分）。契約形態はプロジェクト／単発依頼＝成果物ベースのみを掲載し、時給制・稼働日数拘束・低単価・実績作り無償の案件は除外済み。詳細はログイン後の案件ページで最終確認してください。
</footer>

<script>
(function(){
  // 新規案件はここに追加し、job-search-check-log.md に無い古い案件は削除する（直近40件を目安に保つ）。
  var jobs = [
    {site:"lancers",cat:"LP",title:"交通事故治療LP制作",price:"30,000〜40,000円",note:"整骨院・治療系LP。参考サイトあり。実績を作りやすい単価帯。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5558028"},
    {site:"lancers",cat:"LP",title:"クラウドファンディングページ・ティザーサイトのクリエイティブ制作",price:"200,000〜300,000円",note:"単価が高く、デザイン重視のクリエイティブ案件。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5599905"},
    {site:"lancers",cat:"LP",title:"リラクゼーションサロンの集客・LP型ホームページ制作",price:"30,000〜40,000円",note:"サロン系。強みを活かしやすい可能性あり。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5600123"},
    {site:"lancers",cat:"LP",title:"キッズ向けエンタメスクールのLP",price:"90,000〜100,000円",note:"単価良好、スクール系LP。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5579468"},
    {site:"lancers",cat:"LP",title:"BtoB向けLPのデザイン・実装（既存Wix／原稿・参考HTMLあり）",price:"60,000〜70,000円",note:"原稿・参考HTMLありで進めやすそう。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5594896"},
    {site:"coconala",cat:"LP",title:"子ども向けスクールのLP制作とデザイン担当者を募集",price:"150,000〜200,000円",note:"単価高め、デザイン担当と明記。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5265825"},
    {site:"coconala",cat:"LP",title:"経験者のみ LP制作 複数枚希望",price:"200,000〜250,000円",note:"複数枚まとめて発注、単価良好。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5210492"},
    {site:"coconala",cat:"HP",title:"デザイン面重視のポータルサイト制作",price:"300,000〜400,000円",note:"HP制作でデザイン重視と明記。単価が高い。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5278522"},
    {site:"coconala",cat:"HP",title:"サロン系のポータルサイト制作",price:"250,000〜300,000円",note:"サロン系。実績と合いそう。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5276533"},
    {site:"coconala",cat:"HP",title:"WordPress(SWELL)BtoB企業サイト全面リニューアル",price:"要確認（見積り希望）",note:"WordPress対応案件。制作環境と合致。",contract:"案件ベース（単発）",flag:"check",url:"https://coconala.com/requests/5263765"},
    {site:"coconala",cat:"HP",title:"建設業(電気工事)のホームページ作成",price:"200,000〜250,000円",note:"単価良好なHP制作。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5248972"},
    {site:"coconala",cat:"バナー",title:"越境ECサイトのロゴ・ヘッダー・カテゴリー画像等クリエイティブ一式",price:"50,000〜80,000円",note:"ロゴ＋バナー系をまとめて発注、単価良好。",contract:"案件ベース（単発）",flag:"ok",url:"https://coconala.com/requests/5260734"},
    {site:"coconala",cat:"バナー",title:"完全個室ジムのInstagramカルーセルバナー制作（5枚1セット）",price:"18,000〜20,000円",note:"SNS用バナー5枚セット。単価はまずまず。",contract:"案件ベース（単発）",flag:"check",url:"https://coconala.com/requests/5286277"},
    {site:"lancers",cat:"ロゴ",title:"AI活用の人事コンサル「EaseFound」のロゴ",price:"50,000〜60,000円",note:"ロゴ単体で単価良好。",contract:"プロジェクト（成果物ベース）",flag:"ok",url:"https://www.lancers.jp/work/detail/5570777"},
    {site:"coconala",cat:"ロゴ",title:"ゲームに登場する架空企業のロゴデザイン",price:"30,000〜50,000円",note:"ニッチだが単価は妥当。",contract:"案件ベース（単発）",flag:"check",url:"https://coconala.com/requests/5294304"}
  ];

  var siteMeta = {
    lancers:{label:"ランサーズ",cls:"lc"},
    coconala:{label:"ココナラ",cls:"co"},
    crowdworks:{label:"クラウドワークス",cls:"cw"}
  };

  var listEl = document.getElementById("list");

  function render(filter){
    listEl.innerHTML = "";
    jobs.filter(function(j){ return filter === "all" || j.cat === filter; })
      .forEach(function(j){
        var m = siteMeta[j.site];
        var a = document.createElement("a");
        a.className = "card";
        a.href = j.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML =
          '<div class="card-top">' +
            '<span class="badge ' + m.cls + '">' + m.label + '</span>' +
            '<span class="flag ' + (j.flag === "ok" ? "ok" : "check") + '">' + (j.flag === "ok" ? "確認◯" : "見積り△") + '</span>' +
          '</div>' +
          '<h2>' + j.title + '</h2>' +
          '<div class="price">' + j.price + '</div>' +
          '<div class="memo">' + j.note + '</div>' +
          '<div class="card-bottom">' +
            '<span class="contract">' + j.contract + '</span>' +
            '<span class="open">案件を開く ›</span>' +
          '</div>';
        listEl.appendChild(a);
      });
  }

  document.getElementById("tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    render(btn.dataset.filter);
  });

  render("all");
})();
</script>
